services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NUTRI_SCAN_DB: ${NUTRI_SCAN_DB:-/data/nutri_scan.sqlite3}
      NUTRI_SCAN_COOKIE_SECURE: ${NUTRI_SCAN_COOKIE_SECURE:-false}
      NUTRI_SCAN_ORIGINS: ${NUTRI_SCAN_ORIGINS:-}
      NUTRI_SCAN_STATIC_DIR: /app/frontend-dist
    ports: ["8000:8000"]
    volumes:
      - nutri_scan_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nutri_scan_data:
